name: Build Phone Detective APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # This is the fix. We force the robot to install Gradle 8.5
      # instead of using the incompatible Gradle 9.3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          
      - name: Build with Gradle
        # We use the 'gradle' command (from the setup-gradle step) 
        # instead of your wrapper file to avoid the "manifest" error.
        run: gradle :app:assembleDebug --stacktrace
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-detective-debug
          path: app/build/outputs/apk/debug/*.apk
