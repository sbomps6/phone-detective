name: Build Phone Detective APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with System Gradle
        # We use 'gradle' instead of './gradlew' to bypass the broken wrapper file
        run: gradle :app:assembleDebug --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phone-detective-debug
          path: app/build/outputs/apk/debug/*.apk
